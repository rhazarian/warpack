name: Publish dev package to NPM

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  # Trusted publishing (OIDC) requires npm 11.5.1+.
  NODE_VERSION: 24

jobs:
  platforms:
    name: List platforms
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: List platforms
        id: list
        shell: bash
        # The single source of truth for the supported platforms: it drives the build and
        # publish-binaries matrices and the optionalDependencies of the base package, so a
        # platform package can never be declared without being built and published.
        run: |
          matrix=$(jq -c . <<'EOF'
          [
            { "NAME": "linux-x64", "PKG": "linux-x64", "OS": "ubuntu-22.04", "TARGET": "x86_64-unknown-linux-gnu" },
            { "NAME": "linux-ia32", "PKG": "linux-ia32", "OS": "ubuntu-22.04", "TARGET": "i686-unknown-linux-gnu" },
            { "NAME": "linux-arm64", "PKG": "linux-arm64", "OS": "ubuntu-22.04", "TARGET": "aarch64-unknown-linux-gnu" },
            { "NAME": "win32-x64", "PKG": "windows-x64", "OS": "windows-2022", "TARGET": "x86_64-pc-windows-msvc" },
            { "NAME": "win32-ia32", "PKG": "windows-ia32", "OS": "windows-2022", "TARGET": "i686-pc-windows-msvc" },
            { "NAME": "win32-arm64", "PKG": "windows-arm64", "OS": "windows-2022", "TARGET": "aarch64-pc-windows-msvc" },
            { "NAME": "darwin-arm64", "PKG": "darwin-arm64", "OS": "macos-latest", "TARGET": "aarch64-apple-darwin" }
          ]
          EOF
          )
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT

  build:
    name: Build binaries
    needs: platforms
    runs-on: ${{ matrix.build.OS }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.build.TARGET }}
          override: true
      - name: Build (Linux / MacOS)
        if: matrix.build.OS != 'windows-2022'
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --release --locked --target ${{ matrix.build.TARGET }}
      - name: Build (Windows)
        if: matrix.build.OS == 'windows-2022'
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --locked --target ${{ matrix.build.TARGET }}
      - name: Collect binary
        shell: bash
        run: |
          bin="warpack"
          if [ "${{ matrix.build.OS }}" = "windows-2022" ]; then
            bin="${bin}.exe"
          fi
          mkdir -p "bin/${{ matrix.build.PKG }}"
          cp "target/${{ matrix.build.TARGET }}/release/${bin}" "bin/${{ matrix.build.PKG }}"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.PKG }}
          path: bin/${{ matrix.build.PKG }}
          if-no-files-found: error

  release:
    name: Commit binaries to the release branch
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-get
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: cargo-get
      - name: Determine version
        shell: bash
        run: |
          echo "VERSION=$(cargo-get workspace.package.version)-dev.$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
          echo "TYPES_VERSION=$(node -p 'require("./tstl-types/package.json").version')-dev.$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies and build
        run: npm ci
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: bin
      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit types to the release-types branch
        shell: bash
        run: |
          # npm cannot install a package from a subdirectory of a git repository,
          # so warpack-types gets its own branch rooted at tstl-types/.
          (cd tstl-types && npm version --no-git-tag-version --no-workspaces-update ${{ env.TYPES_VERSION }})
          parents=""
          if git fetch --depth=1 origin release-types; then
            parents="-p $(git rev-parse FETCH_HEAD)"
          fi
          export GIT_INDEX_FILE="${RUNNER_TEMP}/types-index"
          tree=$(cd tstl-types && git --work-tree=. add -A && git write-tree)
          commit=$(git commit-tree ${tree} ${parents} -m "Release warpack-types ${{ env.TYPES_VERSION }}: $(git log -1 --format=%s ${GITHUB_SHA})")
          git push origin "${commit}:refs/heads/release-types"
          echo "TYPES_COMMIT=${commit}" >> $GITHUB_ENV
      - name: Prepare release manifest
        shell: bash
        run: |
          chmod +x bin/*/warpack*
          npm version --no-git-tag-version --no-workspaces-update ${{ env.VERSION }}
          # dist and bin are committed, so installing only needs to drop the other platforms' binaries.
          npm pkg delete scripts devDependencies workspaces
          npm pkg set scripts.prepare="node npm-cli/scripts/prune-binaries.js"
          npm pkg set "dependencies.warpack-types=github:${{ github.repository }}#${{ env.TYPES_COMMIT }}"
      - name: Commit and push
        shell: bash
        run: |
          parents="-p ${GITHUB_SHA}"
          if git fetch --depth=1 origin release; then
            parents="-p $(git rev-parse FETCH_HEAD) ${parents}"
          fi
          git add -f bin dist package.json
          git update-index --chmod=+x bin/*/warpack*
          tree=$(git write-tree)
          commit=$(git commit-tree ${tree} ${parents} -m "Release ${{ env.VERSION }}: $(git log -1 --format=%s ${GITHUB_SHA})")
          git push origin "${commit}:refs/heads/release"

  # Publishing authenticates via npm trusted publishing (OIDC), so every publishing job
  # needs `id-token: write` and every published package must list this workflow as its
  # trusted publisher on npmjs.com.

  publish-types:
    name: Publish types to NPM
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine version
        shell: bash
        run: echo "TYPES_VERSION=$(node -p 'require("./tstl-types/package.json").version')-dev.$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Publish to NPM
        shell: bash
        run: |
          cd tstl-types
          npm version --no-git-tag-version --no-workspaces-update ${{ env.TYPES_VERSION }}
          npm publish --tag dev

  publish-binaries:
    name: Publish binaries
    needs: [platforms, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-get
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: cargo-get
      - name: Determine version
        shell: bash
        run: echo "VERSION=$(cargo-get workspace.package.version)-dev.$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.build.PKG }}
          path: npm-cli/${{ matrix.build.PKG }}/bin
      - name: Publish to NPM
        shell: bash
        run: |
          cd npm-cli
          node_os=$(echo "${{ matrix.build.NAME }}" | cut -d '-' -f1)
          export node_os
          node_arch=$(echo "${{ matrix.build.NAME }}" | cut -d '-' -f2)
          export node_arch
          export node_pkg="${{ matrix.build.PKG }}"
          envsubst < package.json.tmpl > "${node_pkg}/package.json"
          chmod +x "${node_pkg}/bin/"*
          cd "${node_pkg}"
          npm version --no-git-tag-version ${{ env.VERSION }}
          npm publish --tag dev

  publish-npm:
    name: Publish the base package to NPM
    needs: [platforms, publish-binaries, publish-types]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-get
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: cargo-get
      - name: Determine version
        shell: bash
        run: |
          echo "VERSION=$(cargo-get workspace.package.version)-dev.$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
          echo "TYPES_VERSION=$(node -p 'require("./tstl-types/package.json").version')-dev.$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Set package version
        shell: bash
        run: npm version --no-git-tag-version --no-workspaces-update ${{ env.VERSION }}
      - name: Pin dependencies
        shell: bash
        env:
          PLATFORMS: ${{ needs.platforms.outputs.matrix }}
        run: |
          # npm ci fails with "package.json and package-lock.json are not in sync" in every
          # dependent project if an optional dependency does not exist in the registry, so
          # refuse to publish unless each declared platform package is actually there.
          for node_pkg in $(jq -r '.[].PKG' <<< "${PLATFORMS}"); do
            spec="@warpack/${node_pkg}@${{ env.VERSION }}"
            for attempt in 1 2 3 4 5 6; do
              if [ "$(npm view "${spec}" version 2>/dev/null)" = "${{ env.VERSION }}" ]; then
                break
              fi
              if [ "${attempt}" = 6 ]; then
                echo "::error::${spec} is not in the registry"
                exit 1
              fi
              sleep 10
            done
            npm pkg set "optionalDependencies.@warpack/${node_pkg}=${{ env.VERSION }}"
          done
          npm pkg set "dependencies.warpack-types=${{ env.TYPES_VERSION }}"
          npm pkg delete workspaces
      - name: Build
        run: npm run build
      - name: Publish to NPM
        run: npm publish --tag dev
